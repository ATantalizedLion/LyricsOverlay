[project]
name = "lyricsoverlay-align"
version = "0.1.0"
description = "Adds syllable timing to LyricsOverlay's cached lyrics by aligning them to the audio"
requires-python = ">=3.10,<3.13"
dependencies = [
    # torchaudio 2.9+ drops most of its non-core API, keep to the range that has MMS_FA.
    "torch>=2.4,<2.9",
    "torchaudio>=2.4,<2.9",
    "demucs>=4.0.1",
    "uroman>=1.3.1",
    "pyphen>=0.15",
    "langdetect>=1.0.9",
    "mutagen>=1.47",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]
# Optional UVR vocal models (BS-Roformer, MDX-Net) for the sync lab: `uv sync --group uvr`.
uvr = ["audio-separator[cpu]>=0.30"]

[tool.uv]
package = false

# On Windows, PyPI only has CPU builds of PyTorch. Take the CUDA 12.8 builds from PyTorch's
# own index instead: they run on NVIDIA GPUs (RTX 20-series and newer) and fall back to the
# CPU everywhere else. Linux's PyPI builds already include CUDA; macOS has no CUDA.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
