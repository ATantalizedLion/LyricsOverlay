[project]
name = "lyricsoverlay-align"
version = "0.1.0"
description = "Adds syllable timing to LyricsOverlay's cached lyrics by aligning them to the audio"
requires-python = ">=3.10,<3.13"
dependencies = [
    # torchaudio 2.9+ drops most of its non-core API, keep to the range that has MMS_FA.
    "torch>=2.4,<2.9",
    "torchaudio>=2.4,<2.9",
    "demucs>=4.0.1",
    "uroman>=1.3.1",
    "pyphen>=0.15",
    "langdetect>=1.0.9",
    "mutagen>=1.47",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]
# Optional UVR vocal models (BS-Roformer, MDX-Net) for the sync lab: `uv sync --group uvr`.
uvr = ["audio-separator[cpu]>=0.30"]

[tool.uv]
package = false
