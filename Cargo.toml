[package]
name = "spotify_lyrics"
version = "0.1.0"
edition = "2024"

[dependencies]
config = "0.15.19"
oauth2 = "5.0.0"
oneshot = "0.1.13"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.8"
url = "2.5.8"
warp = { version = "0.4.2", features = ["server"] }
webbrowser = "1.1.0"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
egui = "0.33.3"
# wgpu backend required for the egui-winit patch below (WS_EX_NOREDIRECTIONBITMAP only
# matters for a DXGI/wgpu swapchain, not glow/WGL).
eframe = { version = "0.33.3", features = ["wgpu"] }
hmac = "0.12.1"
sha1 = "0.10.6"

# TODO: Remove this patch (and vendor/egui-winit-0.33.3) once emilk/egui#8116 lands in a
# released eframe/egui-winit version. Upstream doesn't set WS_EX_NOREDIRECTIONBITMAP for
# transparent windows, so on Windows the wgpu backend renders opaque - alpha < 1 blends
# toward solid white instead of the desktop behind the window. See vendor/README.md.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit-0.33.3" }

